<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Notker</title>
  </head>
  <body data-view="edicao" data-screen="welcome">
    <div id="menubar"></div>
    <div id="toolbar"></div>
    <div id="wave-bar-host"></div>
    <div id="body-row">
      <aside id="doc-list" class="notker-sidebar"></aside>
      <main id="workspace" class="sc-workspace">
        <div id="app" class="sc-panel"></div>
        <div id="preview" class="sc-panel"></div>
      </main>
      <!-- Vista Neumas: host PRÉ-EXISTENTE; body[data-view] alterna o display. -->
      <main id="neumas-view" class="sc-workspace notker-neumas"></main>
    </div>
    <!-- Telas sem mesa (1b-2): tela inicial e criação guiada; body[data-screen] escolhe. -->
    <section id="welcome-host" class="notker-welcome sc-workspace"></section>
    <section id="guide-host" class="notker-guide sc-workspace"></section>
    <!-- Hosts PRÉ-EXISTENTES (WebKitGTK só repinta popup alternando display de um
         elemento que já existe; véu de tela cheia não repinta no RDP/llvmpipe). -->
    <div id="overlay-host"></div>
    <div id="dialog-host"></div>
    <div id="toast-host" role="status" aria-live="polite"></div>
    <div id="tooltip-host" role="tooltip"></div>
    <!-- Medição fora da tela do desenho de cadeias nabc (nabc-only.ts). -->
    <div id="measure-host" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
