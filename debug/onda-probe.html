<html>

  <title>onda-probe</title>
  <style>
    body { margin: 0; background: #fdfcf9; font-family: serif; }
    #preview { padding: 10px; }
    /* tokens.css não é carregado aqui — estilizo as lanes p/ ficarem VISÍVEIS no screenshot */
    .wave-base { stroke: #d4c7ae; stroke-width: 1; }

      position: fixed; right: 0; top: 0; max-width: 42vw; max-height: 100vh; overflow: auto;
      margin: 0; font: 10px/1.25 monospace; white-space: pre-wrap;
      background: #fff; border-left: 1px solid #ccc; padding: 4px; opacity: 0.95;
    }
  </style>
